name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "vitest.integration.config.ts"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "vitest.integration.config.ts"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      images:
        description: 'Comma-separated list of images to build (or "all"). Leave empty to run CI only.'
        required: false
        default: ""

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:

jobs:
  # ---------------------------------------------------------------------------
  # CI Jobs — test, lint, build (run in parallel)
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter shared --filter github-auth build

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Generate GitHub test summary from CTRF
        if: always()
        run: |
          pnpm exec github-actions-ctrf "ctrf/*-ctrf-report.json" --title "Test Results (Node.js ${{ matrix.node-version }})"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-node-${{ matrix.node-version }}
          path: coverage/

      - name: Post coverage summary to Pull Request
        if: always() && github.event_name == 'pull_request'
        run: |
          node -e "
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const t = summary.total;
          const pct = (v) => v.pct !== undefined && v.pct !== null ? v.pct + '%' : 'N/A';
          const lines = [
            '## 📊 Coverage Summary',
            '',
            '| Category | Coverage | Covered | Total |',
            '|----------|----------|---------|-------|',
            '| **Statements** | ' + pct(t.statements) + ' | ' + t.statements.covered + ' | ' + t.statements.total + ' |',
            '| **Branches** | ' + pct(t.branches) + ' | ' + t.branches.covered + ' | ' + t.branches.total + ' |',
            '| **Functions** | ' + pct(t.functions) + ' | ' + t.functions.covered + ' | ' + t.functions.total + ' |',
            '| **Lines** | ' + pct(t.lines) + ' | ' + t.lines.covered + ' | ' + t.lines.total + ' |',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post test results to Pull Request
        if: always() && github.event_name == 'pull_request'
        run: |
          pnpm exec github-actions-ctrf pull-request "ctrf/*-ctrf-report.json" --title "Test Results (Node.js ${{ matrix.node-version }})" || {
            echo "⚠️ Failed to post PR comment (may be due to permissions)"
            echo "✅ Test results are still available in the Actions summary above"
            exit 0
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CTRF test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrf-test-results-node-${{ matrix.node-version }}
          path: ctrf/

  integration-test:
    name: Integration Tests (${{ matrix.worker.name }})
    needs: [detect-changes]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.detect-changes.outputs.integration-workers) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter shared --filter github-auth build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
        with:
          driver: docker-container

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ matrix.worker.name }}-${{ hashFiles(matrix.worker.dockerfile, matrix.worker.versions_env) }}
          restore-keys: docker-${{ matrix.worker.name }}-

      - name: Pre-build Docker test images
        run: |
          source "${{ matrix.worker.versions_env }}"
          case "${{ matrix.worker.name }}" in
            vscode-web)
              docker buildx build \
                -f "${{ matrix.worker.dockerfile }}" \
                --build-arg VSCODE_VERSION=$VSCODE_VERSION \
                --build-arg COPILOT_CHAT_VERSION=$COPILOT_CHAT_VERSION \
                --cache-from type=local,src=/tmp/.buildx-cache \
                --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                --load .
              docker buildx build \
                -f "${{ matrix.worker.dockerfile }}" \
                --target dev \
                --build-arg VSCODE_VERSION=$VSCODE_VERSION \
                --build-arg COPILOT_CHAT_VERSION=$COPILOT_CHAT_VERSION \
                --cache-from type=local,src=/tmp/.buildx-cache \
                --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                --load .
              ;;
            copilot-acp)
              docker buildx build \
                -t coder-acp-copilot-integration-test \
                -f "${{ matrix.worker.dockerfile }}" \
                --target dev \
                --build-arg COPILOT_CLI_VERSION=$COPILOT_CLI_VERSION \
                --cache-from type=local,src=/tmp/.buildx-cache \
                --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                --load .
              ;;
            vscode-electron)
              docker buildx build \
                -f "${{ matrix.worker.dockerfile }}" \
                --target dev \
                --build-arg VSCODE_VERSION=$VSCODE_VERSION \
                --build-arg COPILOT_CHAT_VERSION=$COPILOT_CHAT_VERSION \
                --cache-from type=local,src=/tmp/.buildx-cache \
                --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                --load .
              ;;
          esac
          # Rotate cache to avoid unbounded growth
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run integration tests
        run: npx vitest run --config vitest.integration.config.ts --silent=false ${{ matrix.worker.test_pattern }}
        env:
          GH_AUTH_USERNAME: ${{ secrets.GH_AUTH_USERNAME }}
          GH_AUTH_PASSWORD: ${{ secrets.GH_AUTH_PASSWORD }}
          GH_AUTH_TOTP_SECRET: ${{ secrets.GH_AUTH_TOTP_SECRET }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Generate GitHub test summary from CTRF
        if: always()
        run: |
          pnpm exec github-actions-ctrf "ctrf/*-integration-ctrf-report.json" --title "Integration Test Results (${{ matrix.worker.name }})" || true

      - name: Upload CTRF integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrf-integration-test-results-${{ matrix.worker.name }}
          path: ctrf/
          if-no-files-found: ignore

      - name: Upload test snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-snapshots-${{ matrix.worker.name }}
          path: test-snapshots/
          if-no-files-found: ignore

      - name: Collect test videos
        if: always()
        run: |
          mkdir -p test-videos
          i=0; find apps/workers/*/test-output -name "*.webm" | sort | while read f; do
            cp "$f" "test-videos/recording-$i.webm"
            i=$((i+1))
          done

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-videos-${{ matrix.worker.name }}
          path: test-videos/
          if-no-files-found: ignore

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # TODO: remove continue-on-error once ESLint is added as a dependency
        continue-on-error: true
        run: pnpm lint

  build:
    name: Build Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Detect which images changed (runs in parallel with CI jobs)
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      judge: ${{ steps.changes.outputs.judge }}
      portal: ${{ steps.changes.outputs.portal }}
      coder-acp-copilot: ${{ steps.changes.outputs.coder-acp-copilot }}
      coder-acp-claude-code: ${{ steps.changes.outputs.coder-acp-claude-code }}
      token-manager: ${{ steps.changes.outputs.token-manager }}
      model-scanner-copilot: ${{ steps.changes.outputs.model-scanner-copilot }}
      model-scanner-anthropic: ${{ steps.changes.outputs.model-scanner-anthropic }}
      report-generator: ${{ steps.changes.outputs.report-generator }}
      db-migrations: ${{ steps.changes.outputs.db-migrations }}
      shared: ${{ steps.changes.outputs.shared }}
      model-scanning: ${{ steps.changes.outputs.model-scanning }}
      build-matrix: ${{ steps.build-matrix.outputs.matrix }}
      integration-workers: ${{ steps.integration-matrix.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' || github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3.0.2
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: changes
        with:
          base: ${{ github.event.before }}
          filters: |
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
            model-scanning:
              - 'packages/model-scanning/**'
            api:
              - 'apps/api/**'
            judge:
              - 'apps/judge/**'
            portal:
              - 'apps/portal/**'
            coder-acp-copilot:
              - 'apps/workers/coder-acp-copilot/**'
            coder-acp-claude-code:
              - 'apps/workers/coder-acp-claude-code/**'
              - 'packages/copilot-driver-ext/**'
            token-manager:
              - 'apps/token-manager/**'
            model-scanner-copilot:
              - 'apps/model-scanners/copilot/**'
            model-scanner-anthropic:
              - 'apps/model-scanners/anthropic/**'
            report-generator:
              - 'apps/workers/report-generator/**'
            db-migrations:
              - 'packages/db-migrations/**'

      - name: Compute build image matrix
        id: build-matrix
        run: |
          MATRIX='[]'
          add_image() {
            MATRIX=$(echo "$MATRIX" | jq -c --arg n "$1" --arg d "$2" '. + [{name: $n, dockerfile: $d}]')
          }

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$INPUT" == "all" ]]; then
              for name in $ALL; do
                case "$name" in
                  api)                       add_image "$name" "apps/api/Dockerfile" ;;
                  judge)                     add_image "$name" "apps/judge/Dockerfile" ;;
                  portal)                    add_image "$name" "apps/portal/Dockerfile" ;;
                  coder-acp-copilot)         add_image "$name" "apps/workers/coder-acp-copilot/Dockerfile" ;;
                  coder-acp-claude-code)     add_image "$name" "apps/workers/coder-acp-claude-code/Dockerfile" ;;
                  token-manager)             add_image "$name" "apps/token-manager/Dockerfile" ;;
                  model-scanner-copilot)     add_image "$name" "apps/model-scanners/copilot/Dockerfile" ;;
                  model-scanner-anthropic)   add_image "$name" "apps/model-scanners/anthropic/Dockerfile" ;;
                  report-generator)          add_image "$name" "apps/workers/report-generator/Dockerfile" ;;
                  db-migrations)             add_image "$name" "packages/db-migrations/Dockerfile" ;;
                esac
              done
            elif [[ -n "$INPUT" ]]; then
              IFS=',' read -ra NAMES <<< "$INPUT"
              for raw in "${NAMES[@]}"; do
                name=$(echo "$raw" | xargs)
                case "$name" in
                  api)                       add_image "$name" "apps/api/Dockerfile" ;;
                  judge)                     add_image "$name" "apps/judge/Dockerfile" ;;
                  portal)                    add_image "$name" "apps/portal/Dockerfile" ;;
                  coder-acp-copilot)         add_image "$name" "apps/workers/coder-acp-copilot/Dockerfile" ;;
                  coder-acp-claude-code)     add_image "$name" "apps/workers/coder-acp-claude-code/Dockerfile" ;;
                  token-manager)             add_image "$name" "apps/token-manager/Dockerfile" ;;
                  model-scanner-copilot)     add_image "$name" "apps/model-scanners/copilot/Dockerfile" ;;
                  model-scanner-anthropic)   add_image "$name" "apps/model-scanners/anthropic/Dockerfile" ;;
                  report-generator)          add_image "$name" "apps/workers/report-generator/Dockerfile" ;;
                  db-migrations)             add_image "$name" "packages/db-migrations/Dockerfile" ;;
                  *) echo "⚠️ Unknown image: $name" ;;
                esac
              done
            fi
          else
            [[ "$API" == "true" || "$SHARED" == "true" ]]                                                       && add_image api "apps/api/Dockerfile"
            [[ "$JUDGE" == "true" || "$SHARED" == "true" ]]                                                     && add_image judge "apps/judge/Dockerfile"
            [[ "$PORTAL" == "true" || "$SHARED" == "true" ]]                                                    && add_image portal "apps/portal/Dockerfile"
            [[ "$CODER_ACP_COPILOT" == "true" || "$SHARED" == "true" ]]                                         && add_image coder-acp-copilot "apps/workers/coder-acp-copilot/Dockerfile"
            [[ "$CODER_ACP_CLAUDE_CODE" == "true" || "$SHARED" == "true" ]]                                     && add_image coder-acp-claude-code "apps/workers/coder-acp-claude-code/Dockerfile"
            [[ "$TOKEN_MANAGER" == "true" || "$SHARED" == "true" ]]                                             && add_image token-manager "apps/token-manager/Dockerfile"
            [[ "$MODEL_SCANNER_COPILOT" == "true" || "$SHARED" == "true" || "$MODEL_SCANNING" == "true" ]]      && add_image model-scanner-copilot "apps/model-scanners/copilot/Dockerfile"
            [[ "$MODEL_SCANNER_ANTHROPIC" == "true" || "$SHARED" == "true" || "$MODEL_SCANNING" == "true" ]]    && add_image model-scanner-anthropic "apps/model-scanners/anthropic/Dockerfile"
            [[ "$REPORT_GENERATOR" == "true" || "$SHARED" == "true" ]]                                          && add_image report-generator "apps/workers/report-generator/Dockerfile"
            [[ "$DB_MIGRATIONS" == "true" ]]                                                                     && add_image db-migrations "packages/db-migrations/Dockerfile"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Images to build: $MATRIX"
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.images }}
          ALL: ${{ env.ALL_IMAGES }}
          API: ${{ steps.changes.outputs.api }}
          JUDGE: ${{ steps.changes.outputs.judge }}
          PORTAL: ${{ steps.changes.outputs.portal }}
          CODER_ACP_COPILOT: ${{ steps.changes.outputs.coder-acp-copilot }}
          CODER_ACP_CLAUDE_CODE: ${{ steps.changes.outputs.coder-acp-claude-code }}
          TOKEN_MANAGER: ${{ steps.changes.outputs.token-manager }}
          MODEL_SCANNER_COPILOT: ${{ steps.changes.outputs.model-scanner-copilot }}
          MODEL_SCANNER_ANTHROPIC: ${{ steps.changes.outputs.model-scanner-anthropic }}
          REPORT_GENERATOR: ${{ steps.changes.outputs.report-generator }}
          DB_MIGRATIONS: ${{ steps.changes.outputs.db-migrations }}
          SHARED: ${{ steps.changes.outputs.shared }}
          MODEL_SCANNING: ${{ steps.changes.outputs.model-scanning }}

      - name: Compute integration test matrix
        id: integration-matrix
        run: |
          node -e '
          const workers = [
            { name: "copilot-acp", dockerfile: "apps/workers/coder-acp-copilot/Dockerfile", versions_env: "apps/workers/coder-acp-copilot/versions.env", test_pattern: "apps/workers/coder-acp-copilot" },
          ];
          const e = process.env;
          const isDispatch = e.EVENT === "workflow_dispatch";
          const changed = {
            "vscode-web": e.CODER_VSCODE_WEB === "true" || e.SHARED === "true",
            "copilot-acp": e.CODER_ACP_COPILOT === "true" || e.SHARED === "true",
            "vscode-electron": e.CODER_VSCODE_ELECTRON === "true" || e.SHARED === "true"
          };
          const result = isDispatch ? workers : workers.filter(w => changed[w.name]);
          require("fs").appendFileSync(e.GITHUB_OUTPUT, "workers=" + JSON.stringify(result) + "\n");
          console.log("Integration workers:", JSON.stringify(result));
          '
        env:
          EVENT: ${{ github.event_name }}
          CODER_ACP_COPILOT: ${{ steps.changes.outputs.coder-acp-copilot }}
          SHARED: ${{ steps.changes.outputs.shared }}

  # ---------------------------------------------------------------------------
  # Build container images — gated on CI passing
  # ---------------------------------------------------------------------------
  build-images:
    name: "Build image: ${{ matrix.image.name }}"
    if: ${{ !failure() && !cancelled() }}
    needs: [test, integration-test, build, detect-changes]
    runs-on: ubuntu-latest
    environment: integration
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tags
        id: tags
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

          # Load versions.env if present (needed for version-prefixed tags)
          VERSION_PREFIX=""
          for f in apps/workers/${{ matrix.image.name }}/versions.env apps/${{ matrix.image.name }}/versions.env; do
            if [ -f "$f" ]; then
              while IFS='=' read -r key value; do
                [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
                export "$key=$value"
              done < "$f"
              break
            fi
          done

          # Build version prefix from component versions
          case "${{ matrix.image.name }}" in
            coder-acp-copilot)
              VERSION_PREFIX="copilot-${COPILOT_CLI_VERSION}" ;;
            coder-acp-claude-code)
              VERSION_PREFIX="claude-code-acp-${CLAUDE_CODE_ACP_VERSION}-sdk-${CLAUDE_AGENT_SDK_VERSION}" ;;
              VERSION_PREFIX="vscode-${VSCODE_VERSION}-copilot-${COPILOT_CHAT_VERSION}" ;;
          esac

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            GIT_SHA="${{ github.event.pull_request.head.sha }}"
            IMAGE_ARGS="--image scoped/${{ matrix.image.name }}:${GIT_SHA}"
            IMAGE_ARGS="${IMAGE_ARGS} --image scoped/${{ matrix.image.name }}:pr-${{ github.event.pull_request.number }}-latest"
          else
            GIT_SHA="${{ github.sha }}"
            SHORT_SHA="${GIT_SHA:0:7}"
            TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
            IMAGE_ARGS="--image scoped/${{ matrix.image.name }}:${GIT_SHA}"
            IMAGE_ARGS="${IMAGE_ARGS} --image scoped/${{ matrix.image.name }}:${TIMESTAMP}-${SHORT_SHA}"
            if [ -n "$VERSION_PREFIX" ]; then
              IMAGE_ARGS="${IMAGE_ARGS} --image scoped/${{ matrix.image.name }}:${VERSION_PREFIX}-${TIMESTAMP}-${SHORT_SHA}"
            fi
          fi

          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_args=${IMAGE_ARGS}" >> "$GITHUB_OUTPUT"

      - name: Load pinned versions
        id: versions
        run: |
          EXTRA_ARGS=""
          for f in apps/workers/${{ matrix.image.name }}/versions.env apps/${{ matrix.image.name }}/versions.env; do
            if [ -f "$f" ]; then
              while IFS='=' read -r key value; do
                [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
                EXTRA_ARGS="${EXTRA_ARGS} --build-arg ${key}=${value}"
              done < "$f"
              break
            fi
          done
          echo "extra_args=${EXTRA_ARGS}" >> $GITHUB_OUTPUT

      - name: Build and push to ACR
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            ${{ steps.tags.outputs.image_args }} \
            --build-arg GIT_COMMIT=${{ steps.tags.outputs.git_sha }} \
            --build-arg BUILD_TIME=${{ steps.tags.outputs.build_time }} \
            ${{ steps.versions.outputs.extra_args }} \
            --file "${{ matrix.image.dockerfile }}" \
            .

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, integration-test, lint, build]
    if: always()

    steps:
      - name: Check overall status
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.integration-test.result }}" = "success" -o "${{ needs.integration-test.result }}" = "skipped" ] && \
             [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed:"
            echo "  Unit Tests: ${{ needs.test.result }}"
            echo "  Integration Tests: ${{ needs.integration-test.result }}"
            echo "  Lint: ${{ needs.lint.result }}"
            echo "  Build: ${{ needs.build.result }}"
            exit 1
          fi
