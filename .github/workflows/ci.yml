name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - 'vitest.integration.config.ts'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - 'vitest.integration.config.ts'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      images:
        description: 'Comma-separated list of images to build (or "all"). Leave empty to run CI only.'
        required: false
        default: ''
      tag:
        description: 'Image tag to use (default: dev)'
        required: false
        default: 'dev'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:

jobs:
  # ---------------------------------------------------------------------------
  # CI Jobs — test, lint, build (run in parallel)
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Generate GitHub test summary from CTRF
        if: always()
        run: |
          pnpm exec github-actions-ctrf "ctrf/*-ctrf-report.json" --title "Test Results (Node.js ${{ matrix.node-version }})"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-node-${{ matrix.node-version }}
          path: coverage/

      - name: Post coverage summary to Pull Request
        if: always() && github.event_name == 'pull_request'
        run: |
          node -e "
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const t = summary.total;
          const pct = (v) => v.pct !== undefined && v.pct !== null ? v.pct + '%' : 'N/A';
          const lines = [
            '## 📊 Coverage Summary',
            '',
            '| Category | Coverage | Covered | Total |',
            '|----------|----------|---------|-------|',
            '| **Statements** | ' + pct(t.statements) + ' | ' + t.statements.covered + ' | ' + t.statements.total + ' |',
            '| **Branches** | ' + pct(t.branches) + ' | ' + t.branches.covered + ' | ' + t.branches.total + ' |',
            '| **Functions** | ' + pct(t.functions) + ' | ' + t.functions.covered + ' | ' + t.functions.total + ' |',
            '| **Lines** | ' + pct(t.lines) + ' | ' + t.lines.covered + ' | ' + t.lines.total + ' |',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post test results to Pull Request
        if: always() && github.event_name == 'pull_request'
        run: |
          pnpm exec github-actions-ctrf pull-request "ctrf/*-ctrf-report.json" --title "Test Results (Node.js ${{ matrix.node-version }})" || {
            echo "⚠️ Failed to post PR comment (may be due to permissions)"
            echo "✅ Test results are still available in the Actions summary above"
            exit 0
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CTRF test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrf-test-results-node-${{ matrix.node-version }}
          path: ctrf/

  integration-test:
    name: Integration Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Run integration tests
        run: npx vitest run --config vitest.integration.config.ts --silent=false --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Generate GitHub test summary from CTRF
        if: always()
        run: |
          pnpm exec github-actions-ctrf "ctrf/*-integration-ctrf-report.json" --title "Integration Test Results (shard ${{ matrix.shard }})" || true

      - name: Upload CTRF integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrf-integration-test-results-shard-${{ matrix.shard }}
          path: ctrf/

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # TODO: remove continue-on-error once ESLint is added as a dependency
        continue-on-error: true
        run: pnpm lint

  build:
    name: Build Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Detect which images changed (runs in parallel with CI jobs)
  # ---------------------------------------------------------------------------
  detect-changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      judge: ${{ steps.changes.outputs.judge }}
      portal: ${{ steps.changes.outputs.portal }}
      coder-acp-copilot: ${{ steps.changes.outputs.coder-acp-copilot }}
      coder-acp-claude-code: ${{ steps.changes.outputs.coder-acp-claude-code }}
      token-manager: ${{ steps.changes.outputs.token-manager }}
      model-scanner-copilot: ${{ steps.changes.outputs.model-scanner-copilot }}
      model-scanner-anthropic: ${{ steps.changes.outputs.model-scanner-anthropic }}
      report-generator: ${{ steps.changes.outputs.report-generator }}
      db-migrations: ${{ steps.changes.outputs.db-migrations }}
      shared: ${{ steps.changes.outputs.shared }}
      model-scanning: ${{ steps.changes.outputs.model-scanning }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ github.event.before }}
          filters: |
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
            model-scanning:
              - 'packages/model-scanning/**'
            api:
              - 'apps/api/**'
            judge:
              - 'apps/judge/**'
            portal:
              - 'apps/portal/**'
            coder-acp-copilot:
              - 'apps/workers/coder-acp-copilot/**'
            coder-acp-claude-code:
              - 'apps/workers/coder-acp-claude-code/**'
            token-manager:
              - 'apps/token-manager/**'
            model-scanner-copilot:
              - 'apps/model-scanners/copilot/**'
            model-scanner-anthropic:
              - 'apps/model-scanners/anthropic/**'
            report-generator:
              - 'apps/workers/report-generator/**'
            db-migrations:
              - 'packages/db-migrations/**'

  # ---------------------------------------------------------------------------
  # Build container images — gated on CI passing (push + PR)
  # ---------------------------------------------------------------------------
  build-images:
    name: 'Build image: ${{ matrix.image.name }}'
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request') && (
        needs.detect-changes.outputs.api == 'true' ||
        needs.detect-changes.outputs.judge == 'true' ||
        needs.detect-changes.outputs.portal == 'true' ||
        needs.detect-changes.outputs.coder-acp-copilot == 'true' ||
        needs.detect-changes.outputs.coder-acp-claude-code == 'true' ||
        needs.detect-changes.outputs.token-manager == 'true' ||
        needs.detect-changes.outputs.model-scanner-copilot == 'true' ||
        needs.detect-changes.outputs.model-scanner-anthropic == 'true' ||
        needs.detect-changes.outputs.report-generator == 'true' ||
        needs.detect-changes.outputs.db-migrations == 'true' ||
        needs.detect-changes.outputs.shared == 'true' ||
        needs.detect-changes.outputs.model-scanning == 'true'
      )
    needs: [test, integration-test, build, detect-changes]
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'pull_request' || github.ref_name != 'main') && 'integration' || 'production' }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: apps/api/Dockerfile
            changed: ${{ (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true') && 'true' || 'false' }}
          - name: judge
            dockerfile: apps/judge/Dockerfile
            changed: ${{ (needs.detect-changes.outputs.judge == 'true' || needs.detect-changes.outputs.shared == 'true') && 'true' || 'false' }}
          - name: portal
            dockerfile: apps/portal/Dockerfile
            changed: ${{ (needs.detect-changes.outputs.portal == 'true' || needs.detect-changes.outputs.shared == 'true') && 'true' || 'false' }}
          - name: coder-acp-copilot
            dockerfile: apps/workers/coder-acp-copilot/Dockerfile
            changed: ${{ (needs.detect-changes.outputs.coder-acp-copilot == 'true' || needs.detect-changes.outputs.shared == 'true') && 'true' || 'false' }}
          - name: coder-acp-claude-code
            dockerfile: apps/workers/coder-acp-claude-code/Dockerfile
            changed: ${{ (needs.detect-changes.outputs.coder-acp-claude-code == 'true' || needs.detect-changes.outputs.shared == 'true') && 'true' || 'false' }}
          - name: token-manager
            dockerfile: apps/token-manager/Dockerfile
            changed: ${{ (needs.detect-changes.outputs.token-manager == 'true' || needs.detect-changes.outputs.shared == 'true') && 'true' || 'false' }}
          - name: model-scanner-copilot
            dockerfile: apps/model-scanners/copilot/Dockerfile
            changed: ${{ (needs.detect-changes.outputs.model-scanner-copilot == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.model-scanning == 'true') && 'true' || 'false' }}
          - name: model-scanner-anthropic
            dockerfile: apps/model-scanners/anthropic/Dockerfile
            changed: ${{ (needs.detect-changes.outputs.model-scanner-anthropic == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.model-scanning == 'true') && 'true' || 'false' }}
          - name: report-generator
            dockerfile: apps/workers/report-generator/Dockerfile
            changed: ${{ (needs.detect-changes.outputs.report-generator == 'true' || needs.detect-changes.outputs.shared == 'true') && 'true' || 'false' }}
          - name: db-migrations
            dockerfile: packages/db-migrations/Dockerfile
            changed: ${{ (needs.detect-changes.outputs.db-migrations == 'true') && 'true' || 'false' }}
        exclude:
          - image:
              changed: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tags
        id: tags
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            GIT_SHA="${{ github.event.pull_request.head.sha }}"
            IMAGE_ARGS="--image scoped/${{ matrix.image.name }}:${GIT_SHA}"
            IMAGE_ARGS="${IMAGE_ARGS} --image scoped/${{ matrix.image.name }}:pr-${{ github.event.pull_request.number }}-latest"
          else
            GIT_SHA="${{ github.sha }}"
            SHORT_SHA="${GIT_SHA:0:7}"
            TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              ENV_TAG="prod"
            else
              ENV_TAG="dev"
            fi
            IMAGE_ARGS="--image scoped/${{ matrix.image.name }}:${GIT_SHA}"
            IMAGE_ARGS="${IMAGE_ARGS} --image scoped/${{ matrix.image.name }}:${ENV_TAG}-latest"
            IMAGE_ARGS="${IMAGE_ARGS} --image scoped/${{ matrix.image.name }}:${ENV_TAG}-${TIMESTAMP}-${SHORT_SHA}"
          fi

          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_args=${IMAGE_ARGS}" >> "$GITHUB_OUTPUT"

      - name: Load pinned versions
        id: versions
        run: |
          EXTRA_ARGS=""
          for f in apps/workers/${{ matrix.image.name }}/versions.env apps/${{ matrix.image.name }}/versions.env; do
            if [ -f "$f" ]; then
              while IFS='=' read -r key value; do
                [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
                EXTRA_ARGS="${EXTRA_ARGS} --build-arg ${key}=${value}"
              done < "$f"
              break
            fi
          done
          echo "extra_args=${EXTRA_ARGS}" >> $GITHUB_OUTPUT

      - name: Build and push to ACR
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            ${{ steps.tags.outputs.image_args }} \
            --build-arg GIT_COMMIT=${{ steps.tags.outputs.git_sha }} \
            --build-arg BUILD_TIME=${{ steps.tags.outputs.build_time }} \
            ${{ steps.versions.outputs.extra_args }} \
            --file "${{ matrix.image.dockerfile }}" \
            .

  # ---------------------------------------------------------------------------
  # Build images manually (workflow_dispatch) — skips CI for emergency rebuilds
  # ---------------------------------------------------------------------------
  build-images-manual:
    name: 'Build image (manual): ${{ matrix.image }}'
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.images != ''
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'integration' }}
    strategy:
      fail-fast: false
      matrix:
    steps:
      - uses: actions/checkout@v4

      - name: Check if image should be built
        id: check
        run: |
          IMAGES="${{ github.event.inputs.images }}"
          if [[ "$IMAGES" == "all" ]] || echo "$IMAGES" | grep -qw "${{ matrix.image }}"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute Dockerfile path
        id: dockerfile
        if: steps.check.outputs.build == 'true'
        run: |
          case "${{ matrix.image }}" in
            api|judge|portal) DOCKERFILE="apps/${{ matrix.image }}/Dockerfile" ;;
            coder-*) DOCKERFILE="apps/workers/${{ matrix.image }}/Dockerfile" ;;
            report-generator) DOCKERFILE="apps/workers/${{ matrix.image }}/Dockerfile" ;;
            model-scanner-copilot) DOCKERFILE="apps/model-scanners/copilot/Dockerfile" ;;
            model-scanner-anthropic) DOCKERFILE="apps/model-scanners/anthropic/Dockerfile" ;;
            db-migrations) DOCKERFILE="packages/db-migrations/Dockerfile" ;;
            *) DOCKERFILE="apps/${{ matrix.image }}/Dockerfile" ;;
          esac
          echo "path=$DOCKERFILE" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        if: steps.check.outputs.build == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load pinned versions
        id: versions
        run: |
          EXTRA_ARGS=""
          for f in apps/workers/${{ matrix.image }}/versions.env apps/${{ matrix.image }}/versions.env; do
            if [ -f "$f" ]; then
              while IFS='=' read -r key value; do
                [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
                EXTRA_ARGS="${EXTRA_ARGS} --build-arg ${key}=${value}"
              done < "$f"
              break
            fi
          done
          echo "extra_args=${EXTRA_ARGS}" >> $GITHUB_OUTPUT

      - name: Build and push to ACR
        if: steps.check.outputs.build == 'true'
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TAG="${{ github.event.inputs.tag }}"
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --image "scoped/${{ matrix.image }}:${{ github.sha }}" \
            --image "scoped/${{ matrix.image }}:${TAG}-latest" \
            --image "scoped/${{ matrix.image }}:${TAG}-${TIMESTAMP}-${SHORT_SHA}" \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_TIME=${BUILD_TIME} \
            ${{ steps.versions.outputs.extra_args }} \
            --file "${{ steps.dockerfile.outputs.path }}" \
            .

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, integration-test, lint, build]
    if: always()

    steps:
      - name: Check overall status
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.integration-test.result }}" = "success" ] && \
             [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed:"
            echo "  Unit Tests: ${{ needs.test.result }}"
            echo "  Integration Tests: ${{ needs.integration-test.result }}"
            echo "  Lint: ${{ needs.lint.result }}"
            echo "  Build: ${{ needs.build.result }}"
            exit 1
          fi
