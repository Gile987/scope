name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "vitest.integration.config.ts"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "vitest.integration.config.ts"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      images:
        description: 'Comma-separated list of images to build (or "all"). Leave empty to run CI only.'
        required: false
        default: ""

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:

jobs:
  # ---------------------------------------------------------------------------
  # CI Jobs — test, lint, build (run in parallel)
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter shared --filter github-auth build

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Generate GitHub test summary from CTRF
        if: always()
        run: |
          pnpm exec github-actions-ctrf "ctrf/*-ctrf-report.json" --title "Test Results (Node.js ${{ matrix.node-version }})"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-node-${{ matrix.node-version }}
          path: coverage/

      - name: Post coverage summary to Pull Request
        if: always() && github.event_name == 'pull_request'
        run: |
          node -e "
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const t = summary.total;
          const pct = (v) => v.pct !== undefined && v.pct !== null ? v.pct + '%' : 'N/A';
          const lines = [
            '## 📊 Coverage Summary',
            '',
            '| Category | Coverage | Covered | Total |',
            '|----------|----------|---------|-------|',
            '| **Statements** | ' + pct(t.statements) + ' | ' + t.statements.covered + ' | ' + t.statements.total + ' |',
            '| **Branches** | ' + pct(t.branches) + ' | ' + t.branches.covered + ' | ' + t.branches.total + ' |',
            '| **Functions** | ' + pct(t.functions) + ' | ' + t.functions.covered + ' | ' + t.functions.total + ' |',
            '| **Lines** | ' + pct(t.lines) + ' | ' + t.lines.covered + ' | ' + t.lines.total + ' |',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post test results to Pull Request
        if: always() && github.event_name == 'pull_request'
        run: |
          pnpm exec github-actions-ctrf pull-request "ctrf/*-ctrf-report.json" --title "Test Results (Node.js ${{ matrix.node-version }})" || {
            echo "⚠️ Failed to post PR comment (may be due to permissions)"
            echo "✅ Test results are still available in the Actions summary above"
            exit 0
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CTRF test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrf-test-results-node-${{ matrix.node-version }}
          path: ctrf/

  integration-test:
    name: "${{ matrix.worker.name == '__none__' && 'Integration tests (none needed)' || format('Integration Tests ({0})', matrix.worker.name) }}"
    needs: [detect-changes]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.detect-changes.outputs.integration-workers) }}

    steps:
      - name: Checkout repository
        if: matrix.worker.name != '__none__'
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        if: matrix.worker.name != '__none__'
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        if: matrix.worker.name != '__none__'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        if: matrix.worker.name != '__none__'
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        if: matrix.worker.name != '__none__'
        run: pnpm --filter shared --filter github-auth build

      - name: Set up Docker Buildx
        if: matrix.worker.name != '__none__'
        uses: docker/setup-buildx-action@v4.0.0
        with:
          driver: docker-container

      - name: Cache Docker layers
        if: matrix.worker.name != '__none__'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ matrix.worker.name }}-${{ hashFiles(matrix.worker.dockerfile, matrix.worker.versions_env) }}
          restore-keys: docker-${{ matrix.worker.name }}-

      - name: Pre-build Docker test images
        if: matrix.worker.name != '__none__'
        run: |
          source "${{ matrix.worker.versions_env }}"
          case "${{ matrix.worker.name }}" in
            vscode-web)
              docker buildx build \
                -f "${{ matrix.worker.dockerfile }}" \
                --build-arg VSCODE_VERSION=$VSCODE_VERSION \
                --build-arg COPILOT_CHAT_VERSION=$COPILOT_CHAT_VERSION \
                --cache-from type=local,src=/tmp/.buildx-cache \
                --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                --load .
              docker buildx build \
                -f "${{ matrix.worker.dockerfile }}" \
                --target dev \
                --build-arg VSCODE_VERSION=$VSCODE_VERSION \
                --build-arg COPILOT_CHAT_VERSION=$COPILOT_CHAT_VERSION \
                --cache-from type=local,src=/tmp/.buildx-cache \
                --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                --load .
              ;;
            copilot-acp)
              docker buildx build \
                -t coder-acp-copilot-integration-test \
                -f "${{ matrix.worker.dockerfile }}" \
                --target dev \
                --build-arg COPILOT_CLI_VERSION=$COPILOT_CLI_VERSION \
                --cache-from type=local,src=/tmp/.buildx-cache \
                --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                --load .
              ;;
            vscode-electron)
              docker buildx build \
                -f "${{ matrix.worker.dockerfile }}" \
                --target dev \
                --build-arg VSCODE_VERSION=$VSCODE_VERSION \
                --build-arg COPILOT_CHAT_VERSION=$COPILOT_CHAT_VERSION \
                --cache-from type=local,src=/tmp/.buildx-cache \
                --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
                --load .
              ;;
          esac
          # Rotate cache to avoid unbounded growth
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run integration tests
        if: matrix.worker.name != '__none__'
        run: npx vitest run --config vitest.integration.config.ts --silent=false ${{ matrix.worker.test_pattern }}
        env:
          GH_AUTH_USERNAME: ${{ secrets.GH_AUTH_USERNAME }}
          GH_AUTH_PASSWORD: ${{ secrets.GH_AUTH_PASSWORD }}
          GH_AUTH_TOTP_SECRET: ${{ secrets.GH_AUTH_TOTP_SECRET }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Generate GitHub test summary from CTRF
        if: always() && matrix.worker.name != '__none__'
        run: |
          pnpm exec github-actions-ctrf "ctrf/*-integration-ctrf-report.json" --title "Integration Test Results (${{ matrix.worker.name }})" || true

      - name: Upload CTRF integration test results
        uses: actions/upload-artifact@v4
        if: always() && matrix.worker.name != '__none__'
        with:
          name: ctrf-integration-test-results-${{ matrix.worker.name }}
          path: ctrf/
          if-no-files-found: ignore

      - name: Upload test snapshots
        uses: actions/upload-artifact@v4
        if: always() && matrix.worker.name != '__none__'
        with:
          name: test-snapshots-${{ matrix.worker.name }}
          path: test-snapshots/
          if-no-files-found: ignore

      - name: Collect test videos
        if: always() && matrix.worker.name != '__none__'
        run: |
          mkdir -p test-videos
          i=0; find apps/workers/*/test-output -name "*.webm" | sort | while read f; do
            cp "$f" "test-videos/recording-$i.webm"
            i=$((i+1))
          done

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: always() && matrix.worker.name != '__none__'
        with:
          name: test-videos-${{ matrix.worker.name }}
          path: test-videos/
          if-no-files-found: ignore

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # TODO: remove continue-on-error once ESLint is added as a dependency
        continue-on-error: true
        run: pnpm lint

  build:
    name: Build Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Detect which images changed (runs in parallel with CI jobs)
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.matrices.outputs.build-matrix }}
      integration-workers: ${{ steps.matrices.outputs.integration-workers }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' || github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3.0.2
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: changes
        with:
          base: ${{ github.event.before }}
          filters: |
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
            model-scanning:
              - 'packages/model-scanning/**'
            api:
              - 'apps/api/**'
            judge:
              - 'apps/judge/**'
            portal:
              - 'apps/portal/**'
            coder-acp-copilot:
              - 'apps/workers/coder-acp-copilot/**'
            coder-acp-claude-code:
              - 'apps/workers/coder-acp-claude-code/**'
              - 'packages/copilot-driver-ext/**'
            token-manager:
              - 'apps/token-manager/**'
            model-scanner-copilot:
              - 'apps/model-scanners/copilot/**'
            model-scanner-anthropic:
              - 'apps/model-scanners/anthropic/**'
            report-generator:
              - 'apps/workers/report-generator/**'
            db-migrations:
              - 'packages/db-migrations/**'

      - name: Compute matrices
        id: matrices
        run: |
          node -e '
          const fs = require("fs");
          const e = process.env;
          const isDispatch = e.EVENT === "workflow_dispatch";
          const ch = (k) => e["CHANGE_" + k] === "true";
          const SENTINEL = [{name: "__none__"}];

          // --- Build image matrix ---
          const images = [
            { name: "api",                     dockerfile: "apps/api/Dockerfile",                              triggers: ["api", "shared"] },
            { name: "judge",                   dockerfile: "apps/judge/Dockerfile",                            triggers: ["judge", "shared"] },
            { name: "portal",                  dockerfile: "apps/portal/Dockerfile",                           triggers: ["portal", "shared"] },
            { name: "coder-acp-copilot",       dockerfile: "apps/workers/coder-acp-copilot/Dockerfile",       triggers: ["coder-acp-copilot", "shared"] },
            { name: "coder-acp-claude-code",   dockerfile: "apps/workers/coder-acp-claude-code/Dockerfile",   triggers: ["coder-acp-claude-code", "shared"] },
            { name: "token-manager",           dockerfile: "apps/token-manager/Dockerfile",                    triggers: ["token-manager", "shared"] },
            { name: "model-scanner-copilot",   dockerfile: "apps/model-scanners/copilot/Dockerfile",          triggers: ["model-scanner-copilot", "shared", "model-scanning"] },
            { name: "model-scanner-anthropic", dockerfile: "apps/model-scanners/anthropic/Dockerfile",        triggers: ["model-scanner-anthropic", "shared", "model-scanning"] },
            { name: "report-generator",        dockerfile: "apps/workers/report-generator/Dockerfile",        triggers: ["report-generator", "shared"] },
            { name: "db-migrations",           dockerfile: "packages/db-migrations/Dockerfile",               triggers: ["db-migrations"] },
          ];

          let buildMatrix;
          if (isDispatch) {
            const input = (e.INPUT || "").trim();
            if (input === "all") {
              buildMatrix = images.map(({name, dockerfile}) => ({name, dockerfile}));
            } else if (input) {
              const requested = new Set(input.split(",").map(s => s.trim()));
              buildMatrix = images.filter(i => requested.has(i.name)).map(({name, dockerfile}) => ({name, dockerfile}));
            } else {
              buildMatrix = [];
            }
          } else {
            buildMatrix = images
              .filter(i => i.triggers.some(t => ch(t)))
              .map(({name, dockerfile}) => ({name, dockerfile}));
          }

          // --- Integration test matrix ---
          const workers = [
            { name: "copilot-acp",      dockerfile: "apps/workers/coder-acp-copilot/Dockerfile",                   versions_env: "apps/workers/coder-acp-copilot/versions.env",                   test_pattern: "apps/workers/coder-acp-copilot",                   triggers: ["coder-acp-copilot", "shared"] },
          ];

          const integrationWorkers = isDispatch
            ? workers
            : workers.filter(w => w.triggers.some(t => ch(t)));

          // Sentinel fallback for empty matrices (avoids GitHub Actions empty-matrix failure)
          const bm = buildMatrix.length > 0 ? buildMatrix : SENTINEL;
          const iw = integrationWorkers.length > 0
            ? integrationWorkers.map(({name, dockerfile, versions_env, test_pattern}) => ({name, dockerfile, versions_env, test_pattern}))
            : SENTINEL;

          fs.appendFileSync(e.GITHUB_OUTPUT, "build-matrix=" + JSON.stringify(bm) + "\n");
          fs.appendFileSync(e.GITHUB_OUTPUT, "integration-workers=" + JSON.stringify(iw) + "\n");
          console.log("Build images:", JSON.stringify(bm));
          console.log("Integration workers:", JSON.stringify(iw));
          '
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.images }}
          CHANGE_api: ${{ steps.changes.outputs.api }}
          CHANGE_judge: ${{ steps.changes.outputs.judge }}
          CHANGE_portal: ${{ steps.changes.outputs.portal }}
          CHANGE_coder-acp-copilot: ${{ steps.changes.outputs.coder-acp-copilot }}
          CHANGE_coder-acp-claude-code: ${{ steps.changes.outputs.coder-acp-claude-code }}
          CHANGE_token-manager: ${{ steps.changes.outputs.token-manager }}
          CHANGE_model-scanner-copilot: ${{ steps.changes.outputs.model-scanner-copilot }}
          CHANGE_model-scanner-anthropic: ${{ steps.changes.outputs.model-scanner-anthropic }}
          CHANGE_report-generator: ${{ steps.changes.outputs.report-generator }}
          CHANGE_db-migrations: ${{ steps.changes.outputs.db-migrations }}
          CHANGE_shared: ${{ steps.changes.outputs.shared }}
          CHANGE_model-scanning: ${{ steps.changes.outputs.model-scanning }}

  # ---------------------------------------------------------------------------
  # Build container images — gated on CI passing
  # ---------------------------------------------------------------------------
  build-images:
    name: "${{ matrix.image.name == '__none__' && 'Image builds (none needed)' || format('Build image: {0}', matrix.image.name) }}"
    if: ${{ !failure() && !cancelled() }}
    needs: [test, integration-test, build, detect-changes]
    runs-on: ubuntu-latest
    environment: integration
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.image.name != '__none__'

      - name: Log in to Azure
        if: matrix.image.name != '__none__'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tags
        id: tags
        if: matrix.image.name != '__none__'
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

          # Load versions.env if present (needed for version-prefixed tags)
          VERSION_PREFIX=""
          for f in apps/workers/${{ matrix.image.name }}/versions.env apps/${{ matrix.image.name }}/versions.env; do
            if [ -f "$f" ]; then
              while IFS='=' read -r key value; do
                [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
                export "$key=$value"
              done < "$f"
              break
            fi
          done

          # Build version prefix from component versions
          case "${{ matrix.image.name }}" in
            coder-acp-copilot)
              VERSION_PREFIX="copilot-${COPILOT_CLI_VERSION}" ;;
            coder-acp-claude-code)
              VERSION_PREFIX="claude-code-acp-${CLAUDE_CODE_ACP_VERSION}-sdk-${CLAUDE_AGENT_SDK_VERSION}" ;;
              VERSION_PREFIX="vscode-${VSCODE_VERSION}-copilot-${COPILOT_CHAT_VERSION}" ;;
          esac

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            GIT_SHA="${{ github.event.pull_request.head.sha }}"
            IMAGE_ARGS="--image scoped/${{ matrix.image.name }}:${GIT_SHA}"
            IMAGE_ARGS="${IMAGE_ARGS} --image scoped/${{ matrix.image.name }}:pr-${{ github.event.pull_request.number }}-latest"
          else
            GIT_SHA="${{ github.sha }}"
            SHORT_SHA="${GIT_SHA:0:7}"
            TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
            IMAGE_ARGS="--image scoped/${{ matrix.image.name }}:${GIT_SHA}"
            IMAGE_ARGS="${IMAGE_ARGS} --image scoped/${{ matrix.image.name }}:${TIMESTAMP}-${SHORT_SHA}"
            if [ -n "$VERSION_PREFIX" ]; then
              IMAGE_ARGS="${IMAGE_ARGS} --image scoped/${{ matrix.image.name }}:${VERSION_PREFIX}-${TIMESTAMP}-${SHORT_SHA}"
            fi
          fi

          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_args=${IMAGE_ARGS}" >> "$GITHUB_OUTPUT"

      - name: Load pinned versions
        id: versions
        if: matrix.image.name != '__none__'
        run: |
          EXTRA_ARGS=""
          for f in apps/workers/${{ matrix.image.name }}/versions.env apps/${{ matrix.image.name }}/versions.env; do
            if [ -f "$f" ]; then
              while IFS='=' read -r key value; do
                [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
                EXTRA_ARGS="${EXTRA_ARGS} --build-arg ${key}=${value}"
              done < "$f"
              break
            fi
          done
          echo "extra_args=${EXTRA_ARGS}" >> $GITHUB_OUTPUT

      - name: Build and push to ACR
        if: matrix.image.name != '__none__'
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            ${{ steps.tags.outputs.image_args }} \
            --build-arg GIT_COMMIT=${{ steps.tags.outputs.git_sha }} \
            --build-arg BUILD_TIME=${{ steps.tags.outputs.build_time }} \
            ${{ steps.versions.outputs.extra_args }} \
            --file "${{ matrix.image.dockerfile }}" \
            .

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, integration-test, lint, build]
    if: always()

    steps:
      - name: Check overall status
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.integration-test.result }}" = "success" -o "${{ needs.integration-test.result }}" = "skipped" ] && \
             [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed:"
            echo "  Unit Tests: ${{ needs.test.result }}"
            echo "  Integration Tests: ${{ needs.integration-test.result }}"
            echo "  Lint: ${{ needs.lint.result }}"
            echo "  Build: ${{ needs.build.result }}"
            exit 1
          fi
