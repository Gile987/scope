name: Build Container Images

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Comma-separated list of images to build (or "all")'
        required: false
        default: 'all'
      tag:
        description: 'Image tag to use (default: dev)'
        required: false
        default: 'dev'
  push:
    branches: [main, dev]
    paths:
      - 'apps/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
  pull_request:
    branches: [dev]
    paths:
      - 'apps/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'

permissions:
  id-token: write
  contents: write
  pull-requests: read

env:

jobs:
  detect-changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      judge: ${{ steps.changes.outputs.judge }}
      portal: ${{ steps.changes.outputs.portal }}
      coder-acp-copilot: ${{ steps.changes.outputs.coder-acp-copilot }}
      coder-acp-claude-code: ${{ steps.changes.outputs.coder-acp-claude-code }}
      shared: ${{ steps.changes.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
            api:
              - 'apps/api/**'
            judge:
              - 'apps/judge/**'
            portal:
              - 'apps/portal/**'
            coder-acp-copilot:
              - 'apps/workers/coder-acp-copilot/**'
            coder-acp-claude-code:
              - 'apps/workers/coder-acp-claude-code/**'

  build-on-push:
    if: github.event_name == 'push'
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: apps/api/Dockerfile
            changed: ${{ needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - name: judge
            dockerfile: apps/judge/Dockerfile
            changed: ${{ needs.detect-changes.outputs.judge == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - name: portal
            dockerfile: apps/portal/Dockerfile
            changed: ${{ needs.detect-changes.outputs.portal == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - name: coder-acp-copilot
            dockerfile: apps/workers/coder-acp-copilot/Dockerfile
            changed: ${{ needs.detect-changes.outputs.coder-acp-copilot == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - name: coder-acp-claude-code
            dockerfile: apps/workers/coder-acp-claude-code/Dockerfile
            changed: ${{ needs.detect-changes.outputs.coder-acp-claude-code == 'true' || needs.detect-changes.outputs.shared == 'true' }}
        exclude:
          - image:
              changed: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Determine environment tag
        id: env-tag
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tag=prod" >> "$GITHUB_OUTPUT"
            echo "overlay=prod" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "overlay=integration" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push to ACR
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          ENV_TAG="${{ steps.env-tag.outputs.tag }}"
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --image "scoped/${{ matrix.image.name }}:${{ github.sha }}" \
            --image "scoped/${{ matrix.image.name }}:${ENV_TAG}" \
            --image "scoped/${{ matrix.image.name }}:${ENV_TAG}-${SHORT_SHA}" \
            --file "${{ matrix.image.dockerfile }}" \
            .

  build-on-pr:
    if: github.event_name == 'pull_request'
    needs: detect-changes
    runs-on: ubuntu-latest
    environment: integration
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: apps/api/Dockerfile
            changed: ${{ needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - name: judge
            dockerfile: apps/judge/Dockerfile
            changed: ${{ needs.detect-changes.outputs.judge == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - name: portal
            dockerfile: apps/portal/Dockerfile
            changed: ${{ needs.detect-changes.outputs.portal == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - name: coder-acp-copilot
            dockerfile: apps/workers/coder-acp-copilot/Dockerfile
            changed: ${{ needs.detect-changes.outputs.coder-acp-copilot == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - name: coder-acp-claude-code
            dockerfile: apps/workers/coder-acp-claude-code/Dockerfile
            changed: ${{ needs.detect-changes.outputs.coder-acp-claude-code == 'true' || needs.detect-changes.outputs.shared == 'true' }}
        exclude:
          - image:
              changed: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push to ACR
        env:
          SHORT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SHORT_SHA="${SHORT_SHA:0:7}"
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --image "scoped/${{ matrix.image.name }}:${{ github.event.pull_request.head.sha }}" \
            --image "scoped/${{ matrix.image.name }}:pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" \
            --file "${{ matrix.image.dockerfile }}" \
            .

  update-image-tags:
    if: github.event_name == 'push'
    needs: [detect-changes, build-on-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine overlay and tag prefix
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "path=deploy/overlays/prod" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=prod" >> "$GITHUB_OUTPUT"
          else
            echo "path=deploy/overlays/integration" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Update image tags for changed images
        env:
          OVERLAY: ${{ steps.env.outputs.path }}
          TAG_PREFIX: ${{ steps.env.outputs.tag_prefix }}
          SHARED_CHANGED: ${{ needs.detect-changes.outputs.shared }}
          API_CHANGED: ${{ needs.detect-changes.outputs.api }}
          JUDGE_CHANGED: ${{ needs.detect-changes.outputs.judge }}
          PORTAL_CHANGED: ${{ needs.detect-changes.outputs.portal }}
          CODER_ACP_COPILOT_CHANGED: ${{ needs.detect-changes.outputs.coder-acp-copilot }}
          CODER_ACP_CLAUDE_CODE_CHANGED: ${{ needs.detect-changes.outputs.coder-acp-claude-code }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          NEW_TAG="${TAG_PREFIX}-${SHORT_SHA}"
          KUSTOMIZATION="${OVERLAY}/kustomization.yaml"

          # Update image tags for changed images only
          # Uses sed to replace the tag in the image reference
          update_image_tag() {
            local image_name="$1"
            # Match the image line and update the tag
            sed -i "s|scoped/${image_name}:${TAG_PREFIX}[^\"]*|scoped/${image_name}:${NEW_TAG}|g" "$KUSTOMIZATION"
          }

          if [[ "$API_CHANGED" == "true" || "$SHARED_CHANGED" == "true" ]]; then
            echo "Updating api to ${NEW_TAG}"
            update_image_tag "api"
          fi

          if [[ "$JUDGE_CHANGED" == "true" || "$SHARED_CHANGED" == "true" ]]; then
            echo "Updating judge to ${NEW_TAG}"
            update_image_tag "judge"
          fi

          if [[ "$PORTAL_CHANGED" == "true" || "$SHARED_CHANGED" == "true" ]]; then
            echo "Updating portal to ${NEW_TAG}"
            update_image_tag "portal"
          fi

          if [[ "$CODER_ACP_COPILOT_CHANGED" == "true" || "$SHARED_CHANGED" == "true" ]]; then
            echo "Updating coder-acp-copilot to ${NEW_TAG}"
            update_image_tag "coder-acp-copilot"
          fi

          if [[ "$CODER_ACP_CLAUDE_CODE_CHANGED" == "true" || "$SHARED_CHANGED" == "true" ]]; then
            echo "Updating coder-acp-claude-code to ${NEW_TAG}"
            update_image_tag "coder-acp-claude-code"
          fi

          if [[ "$CODER_VSCODE_WEB_CHANGED" == "true" || "$SHARED_CHANGED" == "true" ]]; then
          fi

          echo "Updated kustomization.yaml:"
          grep -A1 "value:.*scoped/" "$KUSTOMIZATION" || true

      - name: Commit image tag updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.env.outputs.path }}/kustomization.yaml"
          git diff --cached --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push

  build-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
    steps:
      - uses: actions/checkout@v4

      - name: Check if image should be built
        id: check
        run: |
          IMAGES="${{ github.event.inputs.images }}"
          if [[ "$IMAGES" == "all" ]] || echo "$IMAGES" | grep -qw "${{ matrix.image }}"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute Dockerfile path
        id: dockerfile
        if: steps.check.outputs.build == 'true'
        run: |
          case "${{ matrix.image }}" in
            api|judge|portal) DOCKERFILE="apps/${{ matrix.image }}/Dockerfile" ;;
            coder-*) DOCKERFILE="apps/workers/${{ matrix.image }}/Dockerfile" ;;
            *) DOCKERFILE="apps/${{ matrix.image }}/Dockerfile" ;;
          esac
          echo "path=$DOCKERFILE" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        if: steps.check.outputs.build == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push to ACR
        if: steps.check.outputs.build == 'true'
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --image "scoped/${{ matrix.image }}:${{ github.sha }}" \
            --image "scoped/${{ matrix.image }}:${{ github.event.inputs.tag }}" \
            --file "${{ steps.dockerfile.outputs.path }}" \
            .
