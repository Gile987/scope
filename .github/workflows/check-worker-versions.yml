name: Check Worker Versions

on:
  schedule:
    # Weekdays at 8am SF time (3pm UTC during PDT, 4pm during PST)
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker to check (blank = all)"
        required: false
        type: choice
        options:
          - ""
          - coder-acp-copilot
          - coder-acp-claude-code

permissions:
  contents: read
  issues: write

jobs:
  setup-matrix:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          INPUT="${{ github.event.inputs.worker }}"
          if [ -z "$INPUT" ]; then
            echo "matrix={\"include\":$ALL}" >> $GITHUB_OUTPUT
          else
            echo "matrix={\"include\":[$(echo "$ALL" | jq -c ".[] | select(.worker == \"$INPUT\")")]}" >> $GITHUB_OUTPUT
          fi

  check-versions:
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    name: ${{ matrix.worker }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter ${{ matrix.checker }}

      - name: Check for new versions
        id: check
        run: |
          set +e
          pnpm --silent --filter ${{ matrix.checker }} check > /tmp/versions.json 2>/tmp/versions.log
          EXIT_CODE=$?
          set -e

          echo "::group::check-versions stderr"
          cat /tmp/versions.log
          echo "::endgroup::"
          echo "::group::check-versions stdout"
          cat /tmp/versions.json
          echo "::endgroup::"
          echo "Exit code: $EXIT_CODE"

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "updates_available=true" >> $GITHUB_OUTPUT

            # Parse the standardized components[] JSON output
            node -e "
              const fs = require('fs');
              const r = JSON.parse(fs.readFileSync('/tmp/versions.json', 'utf8'));
              const out = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: 'a' });

              // Helper: write a multi-line output using heredoc delimiter syntax
              function writeMultiline(name, value) {
                out.write(name + '<<GHEOF\n');
                out.write(value + '\n');
                out.write('GHEOF\n');
              }

              // Build title from components that have updates
              const updated = r.components.filter(c => c.current !== c.latest);
              const title = 'chore(' + r.worker + '): update to ' +
                updated.map(c => c.name + ' ' + c.latest).join(', ');
              out.write('title=' + title + '\n');

              // Build issue body table rows
              const tableRows = r.components.map(c =>
                '| ' + c.name + ' | ' + c.current + ' | ' + c.latest + ' |'
              ).join('\n');
              writeMultiline('table_rows', tableRows);

              // Build versions.env content
              const envLines = r.components.map(c => c.envVar + '=' + c.latest).join('\n');
              writeMultiline('env_content', envLines);

              // Build links
              const links = r.components.map(c => '- [' + c.name + '](' + c.link + ')').join('\n');
              writeMultiline('links', links);

              // Build summary status rows
              const statusRows = r.components.map(c => {
                const status = c.current === c.latest ? '✅' : '🔄';
                return '| ' + c.name + ' | ' + c.current + ' | ' + c.latest + ' | ' + status + ' |';
              }).join('\n');
              writeMultiline('status_rows', statusRows);

              // Pass through metadata
              out.write('worker=' + r.worker + '\n');
              out.write('versions_env_path=' + r.versionsEnvPath + '\n');

              out.end();
            "
          else
            echo "updates_available=false" >> $GITHUB_OUTPUT
            echo "No updates available (exit code: $EXIT_CODE)"
          fi

      - name: Check for existing open issue
        if: steps.check.outputs.updates_available == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List open issues with the worker-update label and filter by title prefix.
          # Using list + jq instead of --search to avoid GitHub search index lag
          # which can cause duplicate issues when runs happen close together.
          ISSUE_URL=$(gh issue list --state open --label worker-update --json title,url \
            --jq '[.[] | select(.title | startswith("chore(${{ matrix.worker }}): update to"))] | .[0].url // empty')
          if [ -n "$ISSUE_URL" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
            echo "Existing open issue found: $ISSUE_URL"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue
        id: create_issue
        if: steps.check.outputs.updates_available == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/issue-body.md <<'ISSUE_EOF'
          ## Version updates available for ${{ matrix.worker }}

          | Component | Current | Latest |
          |-----------|---------|--------|
          ${{ steps.check.outputs.table_rows }}

          ### How to update

          Replace the contents of `${{ steps.check.outputs.versions_env_path }}` with:

          ```env
          ${{ steps.check.outputs.env_content }}
          ```

          Then run integration tests:
          ```bash
          pnpm test:integration
          ```

          ### Links

          ${{ steps.check.outputs.links }}
          ISSUE_EOF

          ISSUE_URL=$(gh issue create \
            --title "${{ steps.check.outputs.title }}" \
            --body-file /tmp/issue-body.md \
            --label "worker-update")
          echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT

      - name: Write job summary
        if: always() && steps.check.outputs.exit_code != '2'
        run: |
          if [ "${{ steps.check.outputs.updates_available }}" != "true" ]; then
            cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ## ✅ All versions up to date

          No updates available for ${{ matrix.worker }}.
          EOF
          else
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ⚠️ Updates available for ${{ matrix.worker }}

          | Component | Current | Latest | Status |
          |-----------|---------|--------|--------|
          ${{ steps.check.outputs.status_rows }}

          ## Issue tracking
          EOF
            if [ -n "${{ steps.create_issue.outputs.issue_url }}" ]; then
              echo "📝 **Issue created:** ${{ steps.create_issue.outputs.issue_url }}" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ steps.existing.outputs.exists }}" == "true" ]; then
              echo "ℹ️ **Issue already exists:** ${{ steps.existing.outputs.issue_url }}" >> $GITHUB_STEP_SUMMARY
            fi
          fi
