name: Check VS Code Worker Versions

on:
  schedule:
    # Every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-versions:
    name: Check for version updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm/action-setup@v4 is not allowed on EMU
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter version-checker-vscode-web

      - name: Check for new versions
        id: check
        run: |
          set +e
          pnpm --silent --filter version-checker-vscode-web check > /tmp/versions.json 2>/tmp/versions.log
          EXIT_CODE=$?
          set -e

          echo "::group::check-versions stderr"
          cat /tmp/versions.log
          echo "::endgroup::"
          echo "::group::check-versions stdout"
          cat /tmp/versions.json
          echo "::endgroup::"
          echo "Exit code: $EXIT_CODE"

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "updates_available=true" >> $GITHUB_OUTPUT

            # Parse the JSON output — stdout only, no pnpm noise
            node -e "
              const fs = require('fs');
              const r = JSON.parse(fs.readFileSync('/tmp/versions.json', 'utf8'));
              const out = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: 'a' });
              out.write('vscode_current=' + r.vscode.current + '\n');
              out.write('vscode_latest=' + r.vscode.latest + '\n');
              out.write('copilot_current=' + r.copilotChat.current + '\n');
              out.write('copilot_latest=' + r.copilotChat.latest + '\n');
              const parts = [];
              if (r.vscode.current !== r.vscode.latest) parts.push('VS Code ' + r.vscode.latest);
              if (r.copilotChat.current !== r.copilotChat.latest) parts.push('Copilot Chat ' + r.copilotChat.latest);
              out.end();
            "
          else
            echo "updates_available=false" >> $GITHUB_OUTPUT
            echo "No updates available (exit code: $EXIT_CODE)"
          fi

      - name: Check for existing open issue
        if: steps.check.outputs.updates_available == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Search for open issues with the same title prefix
          if [ "$EXISTING" -gt 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Existing open issue found, skipping creation"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue
        if: steps.check.outputs.updates_available == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          | Component | Current | Latest |
          |-----------|---------|--------|
          | VS Code | ${{ steps.check.outputs.vscode_current }} | ${{ steps.check.outputs.vscode_latest }} |
          | Copilot Chat | ${{ steps.check.outputs.copilot_current }} | ${{ steps.check.outputs.copilot_latest }} |

          ### How to update


          \`\`\`env
          VSCODE_VERSION=${{ steps.check.outputs.vscode_latest }}
          COPILOT_CHAT_VERSION=${{ steps.check.outputs.copilot_latest }}
          \`\`\`

          Then run integration tests and create a PR:
          \`\`\`bash
          pnpm test:integration
          \`\`\`

          ### Links

          - [VS Code Release Notes](https://code.visualstudio.com/updates)
          - [Copilot Chat on Marketplace](https://marketplace.visualstudio.com/items?itemName=GitHub.copilot-chat)
          "

          gh issue create \
            --title "${{ steps.check.outputs.title }}" \
            --body "$BODY" \
            --label "dependencies"
