name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Will create tag v<version>."
        required: true
        type: string

permissions:
  contents: write

env:
  SCOPE_DOC_REPO: growth-ecosystems/scope-doc

jobs:
  publish:
    name: Build & Release CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version in package.json
        working-directory: apps/cli
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build CLI bundle
        working-directory: apps/cli
        env:
          SCOPE_DEFAULT_API_URL: ${{ vars.SCOPE_API_URL }}
        run: node build.mjs

      - name: Verify bundle
        working-directory: apps/cli
        run: |
          node dist/scope.mjs --version
          node dist/scope.mjs --help

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create release on scope-doc
        env:
          GH_TOKEN: ${{ secrets.SCOPE_DOC_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "$SCOPE_DOC_REPO" \
            --title "Scope CLI v${{ inputs.version }}" \
            --notes "## Installation

          \`\`\`bash
          gh release download --repo growth-ecosystems/scope-doc --pattern install.sh -O - | bash
          \`\`\`

          Or download \`scope.mjs\` from this release and place it in your PATH.

          Requires Node.js >= 20." \
            apps/cli/dist/scope.mjs \
            apps/cli/install.sh
