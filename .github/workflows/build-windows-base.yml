name: Build Windows Base Images

on:
  push:
    branches: [main]
    paths:
      - "apps/workers/coder-acp-copilot-windows/Dockerfile.base"
      - "apps/workers/coder-acp-copilot-windows/Dockerfile.deps"
      - "apps/workers/coder-acp-copilot-windows/versions.env"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  WORKER_DIR: apps/workers/coder-acp-copilot-windows

jobs:
  build-base:
    name: "Build base image"
    runs-on: ubuntu-latest
    environment: integration
    outputs:
      base_tag: ${{ steps.tags.outputs.base_tag }}
      base_image: ${{ steps.tags.outputs.base_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compute base image tag
        id: tags
        run: |
          # Tag based on content hash of Dockerfile.base for cache-busting
          HASH=$(sha256sum ${{ env.WORKER_DIR }}/Dockerfile.base | cut -c1-12)
          BASE_TAG="base-${HASH}"
          ACR_LOGIN_SERVER=$(az acr show --name "${{ vars.ACR_NAME }}" --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" --query loginServer -o tsv)
          BASE_IMAGE="${ACR_LOGIN_SERVER}/scoped/coder-acp-copilot-windows-base:${BASE_TAG}"
          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "base_image=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Check if base image already exists
        id: check
        run: |
          if az acr repository show-tags --name "${{ vars.ACR_NAME }}" --repository scoped/coder-acp-copilot-windows-base --query "[?@=='${{ steps.tags.outputs.base_tag }}']" -o tsv | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image
        if: steps.check.outputs.exists != 'true'
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --platform windows/amd64 \
            --image "scoped/coder-acp-copilot-windows-base:${{ steps.tags.outputs.base_tag }}" \
            --image "scoped/coder-acp-copilot-windows-base:latest" \
            --file "${{ env.WORKER_DIR }}/Dockerfile.base" \
            .

  build-deps:
    name: "Build deps image"
    needs: [build-base]
    runs-on: ubuntu-latest
    environment: integration
    outputs:
      deps_tag: ${{ steps.tags.outputs.deps_tag }}
      deps_image: ${{ steps.tags.outputs.deps_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load pinned versions
        id: versions
        run: |
          source ${{ env.WORKER_DIR }}/versions.env
          echo "copilot_cli_version=${COPILOT_CLI_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compute deps image tag
        id: tags
        run: |
          # Tag based on base image + versions.env content
          HASH=$(cat ${{ env.WORKER_DIR }}/Dockerfile.deps ${{ env.WORKER_DIR }}/versions.env | sha256sum | cut -c1-12)
          DEPS_TAG="deps-${HASH}"
          ACR_LOGIN_SERVER=$(az acr show --name "${{ vars.ACR_NAME }}" --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" --query loginServer -o tsv)
          DEPS_IMAGE="${ACR_LOGIN_SERVER}/scoped/coder-acp-copilot-windows-deps:${DEPS_TAG}"
          echo "deps_tag=${DEPS_TAG}" >> "$GITHUB_OUTPUT"
          echo "deps_image=${DEPS_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Check if deps image already exists
        id: check
        run: |
          if az acr repository show-tags --name "${{ vars.ACR_NAME }}" --repository scoped/coder-acp-copilot-windows-deps --query "[?@=='${{ steps.tags.outputs.deps_tag }}']" -o tsv | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push deps image
        if: steps.check.outputs.exists != 'true'
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --platform windows/amd64 \
            --image "scoped/coder-acp-copilot-windows-deps:${{ steps.tags.outputs.deps_tag }}" \
            --image "scoped/coder-acp-copilot-windows-deps:latest" \
            --build-arg "BASE_IMAGE=${{ needs.build-base.outputs.base_image }}" \
            --build-arg "COPILOT_CLI_VERSION=${{ steps.versions.outputs.copilot_cli_version }}" \
            --file "${{ env.WORKER_DIR }}/Dockerfile.deps" \
            .
