<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Scope logo</title>
  <desc id="description">A focused circular scope mark with a central measurement point.</desc>
  <defs>
    <linearGradient id="background" x1="30" y1="20" x2="224" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0078D4"/>
      <stop offset=".5" stop-color="#3B4CCA"/>
      <stop offset="1" stop-color="#7A3E9D"/>
    </linearGradient>
    <linearGradient id="ring" x1="70" y1="55" x2="190" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".96"/>
      <stop offset="1" stop-color="#D8E6FF" stop-opacity=".6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#background)"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="url(#ring)" stroke-width="2" opacity=".35"/>
  <circle cx="128" cy="128" r="58" fill="none" stroke="url(#ring)" stroke-width="3" opacity=".7"/>
  <path d="M128 32V64M128 192V224M32 128H64M192 128H224" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".82"/>
  <path d="M83 173L112 144L135 155L175 104" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="175" cy="104" r="10" fill="#D9F2FF" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="13" fill="#FFFFFF"/>
  <circle cx="128" cy="128" r="6" fill="#1967C9"/>
</svg>
