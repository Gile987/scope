\* TLC Model Configuration for Gateway.tla (Multi-Replica)

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* --- Constants ---
\* Reduced model: 2 replicas, 1 slot each, 2 IPs to keep state space tractable
CONSTANT
    Replicas = {r1, r2}
    ClientIPs = {c1, c2}
    SessionSlots = {s1}
    MaxSessions = 1
    IdleTimeoutTicks = 2
    MaxTicks = 4

CONSTANT
    Free = Free
    Active = Active
    Stopped = Stopped

CONSTANT
    HarNone = HarNone
    Recording = Recording
    Finalized = Finalized
    HarFailed = HarFailed

CONSTANT
    NULL = NULL

CONSTANT
    Booting = Booting
    Live = Live

\* --- Safety Invariants (per-replica) ---
INVARIANT TypeOK
INVARIANT UniqueIPPerReplica
INVARIANT CapacityRespected
INVARIANT HarOnlyWhenRecording
INVARIANT StoppedImpliesFinalized
INVARIANT FreeSlotClean
INVARIANT AllocatedHasIP
INVARIANT ActiveHarState
INVARIANT NoSessionsBeforeLive
INVARIANT ReadyImpliesBlob
INVARIANT LivenessIndependentOfBlob
INVARIANT CrashCleansSlots

\* --- Temporal Safety ---
PROPERTY BlobConfigImmutable
