\* TLC Model Configuration for Gateway.tla (Multi-Replica)

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* --- Constants ---
\* 2 replicas, 2 slots each, 2 IPs — symmetry reduces state space ~8x
CONSTANT
    Replicas = {r1, r2}
    ClientIPs = {c1, c2}
    SessionSlots = {s1, s2}
    MaxSessions = 2
    IdleTimeoutTicks = 2
    MaxTicks = 3

SYMMETRY Symmetry

CONSTANT
    Free = Free
    Active = Active
    Stopped = Stopped

CONSTANT
    HarNone = HarNone
    Recording = Recording
    Finalized = Finalized
    HarFailed = HarFailed

CONSTANT
    NULL = NULL

CONSTANT
    Booting = Booting
    Live = Live

\* --- Safety Invariants (per-replica) ---
INVARIANT TypeOK
INVARIANT UniqueIPPerReplica
INVARIANT CapacityRespected
INVARIANT HarOnlyWhenRecording
INVARIANT StoppedImpliesFinalized
INVARIANT FreeSlotClean
INVARIANT AllocatedHasIP
INVARIANT ActiveHarState
INVARIANT NoSessionsBeforeLive
INVARIANT ReadyImpliesBlob
INVARIANT LivenessIndependentOfBlob
INVARIANT CrashCleansSlots

\* --- Temporal Safety ---
\* NOTE: BlobConfigImmutable is verified separately without SYMMETRY.
\* SYMMETRY is unsound with temporal properties.
\* Verified exhaustively with {s1} model — structurally guaranteed.
