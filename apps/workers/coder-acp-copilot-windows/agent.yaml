_id: coder-acp-copilot-windows
name: GitHub Copilot CLI (Windows)
description: GitHub Copilot coding agent via ACP protocol on Windows
modelProvider: github-copilot
available: true
capabilities:
  supportsReasoningEffort: true
options:
